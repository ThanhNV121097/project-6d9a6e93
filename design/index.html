<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World Acceptance 9</title>
  <style>
    :root {
      --background: #FFFFFF;
      --text: #000000;
      --accent: #2563EB;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
    }

    .greeting-section {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(44px, 10vw, 80px);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.04em;
      overflow-wrap: anywhere;
    }

    form {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: stretch;
      width: 100%;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input {
      min-width: 0;
      flex: 1;
      max-width: 360px;
      min-height: 48px;
      border: 2px solid var(--text);
      border-radius: 0;
      background: var(--background);
      color: var(--text);
      font: inherit;
      font-size: 18px;
      padding: 10px 12px;
    }

    button {
      min-height: 48px;
      border: 2px solid var(--accent);
      border-radius: 0;
      background: var(--accent);
      color: var(--background);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      padding: 10px 20px;
      cursor: pointer;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }

    .message {
      min-height: 24px;
      margin: 12px 0 0;
      font-size: 16px;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      body {
        padding: 20px;
      }

      form {
        flex-direction: column;
      }

      input,
      button {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="greeting-section" aria-labelledby="greeting-heading">
      <h1 id="greeting-heading">Hello, World!</h1>
      <form id="greeting-form" novalidate>
        <label for="greeting-input">Greeting</label>
        <input id="greeting-input" name="greeting" type="text" value="Hello, World!" autocomplete="off" required>
        <button type="submit">Save</button>
      </form>
      <p class="message" id="form-message" aria-live="polite"></p>
    </section>
  </main>
  <script>
    (function () {
      var form = document.getElementById('greeting-form');
      var heading = document.getElementById('greeting-heading');
      var input = document.getElementById('greeting-input');
      var message = document.getElementById('form-message');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        var nextGreeting = input.value.trim();
        if (!nextGreeting) {
          message.textContent = 'Enter a greeting.';
          input.focus();
          return;
        }

        heading.textContent = nextGreeting;
        input.value = nextGreeting;
        message.textContent = 'Saved.';
      });
    }());
  </script>
</body>
</html>
